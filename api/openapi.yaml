{
  "openapi": "3.0.3",
  "info": {
    "title": "DevDocs API",
    "version": "1.0.0",
    "description": "Single-user. No search is persisted. Explicit save only. Bearer CLI token or web HttpOnly session. Cookie-authenticated mutations require X-CSRF-Token and matching configured Origin. AI synthesis is optional and requires GROQ_API_KEY. Without it AI=true returns 503 ai_unavailable. Groq errors fall back to labeled deterministic evidence. Literal evidence retains source language; ai_assisted prose may translate/paraphrase it without changing examples or references."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "security": [
    {
      "cliToken": []
    },
    {
      "webSession": []
    }
  ],
