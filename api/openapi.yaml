            "minItems": 1
          },
          "evidence": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Evidence"
            }
          },
          "mode": {
            "type": "string",
            "enum": [
              "deterministic",
              "ai_assisted"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "completed",
              "partial"
            ]
          },
          "quality": {
            "type": "string",
            "enum": [
              "extracted",
              "limited"
            ]
          },
          "language": {
            "type": "string",
            "enum": [
              "pt-BR",
              "en"
            ]
          }
        },
        "required": [
          "query",
          "title",
          "technology",
          "version",
          "summary",
          "description",
          "examples",
          "observations",
          "references",
          "evidence",
          "mode",
          "status",
          "quality",
          "language"
