  "components": {
    "securitySchemes": {
      "cliToken": {
        "type": "http",
        "scheme": "bearer",
        "description": "CLI token, independent from web password."
      },
      "webSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "devdocs_session",
        "description": "Obtain via POST /auth/session. GET returns CSRF token. Mutations additionally require Origin and X-CSRF-Token."
      }
    },
    "schemas": {
      "SearchRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "query": {
            "type": "string",
            "minLength": 3,
            "maxLength": 600
          },
          "language": {
            "type": "string",
            "enum": [
              "pt-BR",
              "en"
            ],
            "default": "pt-BR"
          },
          "preferred_sources": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "official",
                "complementary"
              ]
            },
            "maxItems": 2
          },
          "ai_enabled": {
            "type": "boolean",
            "default": false
          },
          "technology": {
            "type": "string",
            "enum": [
              "python",
              "pandas",
              "postgresql",
              "go",
              "docker",
              "airflow",
              "spark",
              "dbt",
              "fastapi",
              "kubernetes",
              "sqlalchemy"
            ],
            "description": "Optional registered technology to scope the search."
          }
        },
        "required": [
          "query"
        ]
      },
      "Reference": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^source-[0-9]+$"
          },
          "title": {
            "type": "string"
          },
          "url": {
            "type": "string",
            "format": "uri"
          },
          "domain": {
            "type": "string"
          },
          "official": {
            "type": "boolean"
          },
          "technology": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "excerpt": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "title",
          "url",
          "domain",
          "official",
          "technology",
          "version",
          "excerpt"
        ]
      },
      "Explanation": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "snippet": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "reference_id": {
            "type": "string"
          }
        },
        "required": [
          "snippet",
          "description",
          "reference_id"
        ]
      },
      "Example": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "language": {
            "type": "string"
          },
          "code": {
            "type": "string"
          },
          "explanations": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Explanation"
            }
          },
          "reference_id": {
            "type": "string"
          },
          "source_code": {
            "type": "string",
            "maxLength": 16000,
            "description": "Original literal documentation block, before separating interactive prompts and output."
          },
          "setup": {
            "type": "string",
            "maxLength": 16000,
            "description": "Literal import statements collected from the same page for aliases used by this snippet. Context only; not a claim that every dependency is supplied."
          },
          "output": {
            "type": "string",
            "maxLength": 16000,
            "description": "Documented interactive output, never included in copied executable code."
          },
          "setup_reference_id": {
            "type": "string",
            "description": "Reference providing the documented imports. Defaults to reference_id when absent."
          }
        },
        "required": [
          "language",
          "code",
          "explanations",
          "reference_id"
        ]
      },
      "Evidence": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "reference_id": {
            "type": "string"
          },
          "field": {
            "type": "string",
            "enum": [
              "summary",
              "description",
              "example",
              "setup"
            ]
          },
          "quote": {
            "type": "string"
          }
        },
        "required": [
          "reference_id",
          "field",
          "quote"
        ]
      },
      "SearchResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "query": {
            "type": "string",
            "minLength": 3,
            "maxLength": 600
          },
          "title": {
            "type": "string",
            "maxLength": 255
          },
          "technology": {
            "type": "string",
            "maxLength": 100
          },
          "version": {
            "type": "string"
          },
          "summary": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "examples": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Example"
            }
          },
          "observations": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "references": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Reference"
