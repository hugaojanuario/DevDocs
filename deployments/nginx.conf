server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    error_log /dev/null;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/v1/ {
        proxy_pass http://devdocs-api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_buffering off;
        proxy_intercept_errors off;
    }
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"Limite de 1 MiB","request_id":"proxy"}}';
    }
    location = /openapi.yaml { default_type application/yaml; }
    location / { try_files $uri /index.html @handoff; }
    location @handoff {
        default_type text/plain;
        return 200 'DevDocs: API operacional em /api/v1. Interface aguardando handoff. Contrato: /openapi.yaml\n';
    }
}
